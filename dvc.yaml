stages:

  prepare:
    cmd: python src/prepare.py data/data.xml
    params:
    - prepare.split
    - prepare.seed
    outs:
    - data/prepared/train.tsv

  feature:
    cmd: python src/featurization.py data/prepared data/feature
    deps:
    - src/featurization.py
    - data/prepared
    params:
    - featurize.max_features
    - featurize.ngrams
    outs:
    - data/feature

  train:
    cmd: python src/train.py data/feature data/model
    deps:
    - src/train.py
    - data/feature
    params:
    - train.seed
    - train.n_est
    - train.min_split

  evaluate:
    cmd: python src/evaluate.py  data/model data/feature
    deps:
    - src/evaluate.py
    - data/feature
    - data/model

metrics:
- eval/metrics.json
plots:
- eval/plots/images
- eval/plots/sklearn/roc/train.json:
    template: simple
    x: fpr
    y: tpr
    title: Receiver operating characteristic (ROC)
    x_label: False Positive Rate
    y_label: True Positive Rate
- eval/plots/sklearn/prc/train.json:
    template: simple
    x: recall
    y: precision
    title: Precision-Recall Curve
    x_label: Recall
    y_label: Precision
- eval/plots/sklearn/cm/train.json:
    template: confusion
    x: actual
    y: predicted
    title: Confusion Matrix
    x_label: True Label
    y_label: Predicted Label
- eval/plots/sklearn/roc/test.json:
    template: simple
    x: fpr
    y: tpr
    title: Receiver operating characteristic (ROC)
    x_label: False Positive Rate
    y_label: True Positive Rate
- eval/plots/sklearn/prc/test.json:
    template: simple
    x: recall
    y: precision
    title: Precision-Recall Curve
    x_label: Recall
    y_label: Precision
- eval/plots/sklearn/cm/test.json:
    template: confusion
    x: actual
    y: predicted
    title: Confusion Matrix
    x_label: True Label
    y_label: Predicted Label
